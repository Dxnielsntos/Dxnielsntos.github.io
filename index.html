<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Carta para Ti</title>
    <!-- Aquí conectamos tu archivo de diseño -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Corazones azules decorativos flotando de fondo -->
    <div class="heart" style="top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="heart" style="top: 75%; left: 10%; animation-delay: 1.2s;"></div>
    <div class="heart" style="top: 25%; right: 18%; animation-delay: 0.5s;"></div>
    <div class="heart" style="top: 80%; right: 15%; animation-delay: 1.8s;"></div>

    <div class="main-canvas">
        <div class="envelope-wrapper">
            <!-- El Sobre -->
            <div id="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                
                <!-- La Carta -->
                <div class="letter">
                    <div class="message">
                        <h1>Hola...</h1>
                        <p>Quería escribirte esto porque hay detalles que se aprecian mucho más cuando están en una carta.</p>
                        <p>Espero que esto te saque una sonrisa y que tengas un día increíble.</p>
                        
                        <!-- Tu firma -->
                        <p class="signature">Con amor, Daniel</p>
                    </div>
                </div>
                
                <!-- El Sello para abrir la carta -->
                <img src="image_f2e2c6.jpg" alt="Sello" class="wax-seal" id="seal">
            </div>
        </div>
    </div>

    <!-- Aquí conectamos tu archivo de animaciones (sonidos y clics) -->
    <script src="script.js"></script>
</body>
</html>
